<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leve o Aroma de Pizza para o Seu Evento</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #fff7ec;
      margin: 0;
      padding: 0;
      color: #333;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      padding: 30px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header img {
      max-width: 100%;
      border-radius: 10px;
    }
    h1 {
      font-size: 24px;
      margin: 20px 0 10px;
      color: #d3340d;
    }
    p {
      font-size: 16px;
      margin-bottom: 30px;
    }
    form label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }
    form input, form select, form textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 5px;
    }
    form button {
      margin-top: 25px;
      width: 100%;
      background-color: #d3340d;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    form button:hover {
      background-color: #b42d0b;
    }
    .contato {
      text-align: center;
      margin-top: 40px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://andrealmeidacaem.github.io/aroma-trailer.jpg" alt="Trailer Aroma de Pizza">
      <h1>Leve o Aroma de Pizza para o seu evento!</h1>
      <p>Nosso trailer, equipe e forno vão até sua festa, evento ou confraternização. Preencha o formulário abaixo e receba um orçamento personalizado:</p>
    </div>
    <form action="https://formsubmit.co/aromadepizzacaem@gmail.com" method="POST">
      <label for="nome">Seu nome</label>
      <input type="text" id="nome" name="nome" required>

      <label for="telefone">WhatsApp</label>
      <input type="tel" id="telefone" name="telefone" required>

      <label for="evento">Tipo de evento</label>
      <input type="text" id="evento" name="evento" placeholder="Casamento, aniversário, confraternização..." required>

      <label for="pessoas">Quantidade estimada de pessoas</label>
      <input type="number" id="pessoas" name="pessoas" required>

      <label for="local">Local do evento (cidade e endereço)</label>
      <input type="text" id="local" name="local" required>

      <label for="data">Data prevista do evento</label>
      <input type="date" id="data" name="data" required>

      <label for="mensagem">Mensagem ou observações</label>
      <textarea id="mensagem" name="mensagem" rows="4"></textarea>

      <button type="submit">Quero receber um orçamento</button>
    </form>
    <div class="contato">
      <p><strong>Contato:</strong></p>
      <p>Email: aromadepizzacaem@gmail.com</p>
      <p>WhatsApp: (74) 98123-0995</p>
    </div>
  </div>
</body>
</html>
